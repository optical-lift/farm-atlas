name: Atlas source custody recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: atlas-source-custody-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover-production-source:
    if: github.head_ref == 'recovery/atlas-source-custody-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/atlas-source-custody-v1
          fetch-depth: 0

