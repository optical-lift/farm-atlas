          while read -r version name expected; do
            path="supabase/migrations/${version}_${name}.sql"
            curl -fsSL --retry 3 -H "Authorization: Bearer $SUPABASE_ANON_KEY" "$base?version=$version" -o "$path"
            actual="$(sha256sum "$path" | awk '{print $1}')"
            test "$actual" = "$expected" || { echo "checksum mismatch $path expected=$expected actual=$actual" >&2; exit 1; }
            echo "verified $path $actual"
          done < /tmp/atlas-source-custody-manifest

          git fetch origin main
          git checkout origin/main -- .github/workflows/atlas-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations .github/workflows/atlas-ci.yml
          if git diff --cached --quiet; then
            echo "No source-custody changes were required."
            exit 0
          fi
          git commit -m "Recover exact deployed Worker Day migration source"
          git push origin HEAD:recovery/atlas-source-custody-v1
