name: Atlas source custody recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: atlas-source-custody-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover-production-source:
    if: github.head_ref == 'recovery/atlas-source-custody-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/atlas-source-custody-v1
          fetch-depth: 0

      - name: Recover exact deployed Worker and Day migration source
        shell: bash
        env:
          SUPABASE_URL: https://zirqkouammpwxlqfbsvf.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppcnFrb3VhbW1wd3hscWZic3ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MjU2MjAsImV4cCI6MjA4NzEwMTYyMH0.Y4zgLr-cEx1DH3_0QUrHl4CAVzVBLYFlqM8zHxyE61c
        run: |
          set -euo pipefail
          base="$SUPABASE_URL/functions/v1/temporary-atlas-source-custody-recovery"
          mkdir -p supabase/migrations
          cat > /tmp/atlas-source-custody-manifest <<'MANIFEST'
          20260812124733 gentle_pressure_wash_serial_queue_v1 2c1566e2ef05e1d1cda6f4ac11d0b097876bf4e671e8129421c2aad1a21e37f8
