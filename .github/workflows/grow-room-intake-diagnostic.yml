name: Grow Room Intake Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download source quietly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir source
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            | tar -xz --strip-components=1 -C source
      - name: Report only failing tests
        shell: bash
        run: |
          cd source
          npm ci --silent
          set +e
          npm test > test-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -n -A45 -B8 -E '^not ok|ERR_|AssertionError|error:' test-output.log | head -n 160 || tail -n 160 test-output.log
            exit "$status"
          fi
          tail -n 12 test-output.log
