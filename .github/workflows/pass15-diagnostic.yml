name: Pass15 diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run focused Clock tests with visible annotation
        shell: bash
        run: |
          set +e
          node --test tests/atlas-clock-proposal-pass14.test.mjs tests/atlas-clock-plan-approval-pass15.test.mjs > focused.log 2>&1
          status=$?
          message="$(cat focused.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-6000)"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Focused Clock test output::$message"
            exit "$status"
          fi
          echo "::notice title=Focused Clock tests passed::$message"
