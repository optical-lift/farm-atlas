name: Pass15 diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run tests with visible failure annotation
        shell: bash
        run: |
          set +e
          npm test > atlas-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 120 atlas-test.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-6000)"
            echo "::error title=Pass15 test failure::$message"
            exit "$status"
          fi
          tail -n 20 atlas-test.log
