name: Recover P9 P10 production migration source

on:
  push:
    branches:
      - agent/release-clean-p9-p10

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover exact production migration SQL
        shell: bash
        env:
          SUPABASE_URL: https://zirqkouammpwxlqfbsvf.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppcnFrb3VhbW1wd3hscWZic3ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MjU2MjAsImV4cCI6MjA4NzEwMTYyMH0.Y4zgLr-cEx1DH3_0QUrHl4CAVzVBLYFlqM8zHxyE61c
        run: |
          set -euo pipefail
          base="$SUPABASE_URL/functions/v1/temporary-p9-p10-source-recovery"
          mkdir -p supabase/migrations
          fetch() {
            local version="$1" name="$2" expected="$3" path="supabase/migrations/${version}_${name}.sql"
            curl -fsSL --retry 3 -H "Authorization: Bearer $SUPABASE_ANON_KEY" "$base?version=$version" -o "$path"
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || { echo "checksum mismatch $path expected=$expected actual=$actual" >&2; exit 1; }
            echo "verified $path $actual"
          }
          fetch 20260820011351 p9_harvest_requirement_expression_v2 2df9711d0ebe6528361eb02286400b031ed0fbb3
          fetch 20260820012515 p9_harvest_task_generation_v2 a04275166d6773b0273dfefd43be40307a130177
          fetch 20260820012614 p9_harvest_reconciliation_failure_injection b1dad3460aba0c0b6704355251f607c5aaed7cf9
          fetch 20260820012842 p9_harvest_rejected_run_failure_injection 5b7a233485deeed6abe422544824aef01c0f3b84
          fetch 20260820014810 p10_execution_checklists 3f79aa1280dc3912113b0cd53ab22b55daf21310
          fetch 20260820015616 p10_consume_worker_signal_from_checklist 6bb60444bedc1106a1b2ab358bc7a1a3d159ed1b
          rm -f .github/workflows/recover-p9-p10-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations .github/workflows/recover-p9-p10-source.yml
          git commit -m "Recover exact production P9 P10 migration source"
          git push origin HEAD:agent/release-clean-p9-p10
