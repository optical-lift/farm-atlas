name: Atlas staged Titus callback origin proof
on:
  push:
    branches:
      - work/atlas-titus-canonical-redirect-20261011
    paths:
      - .github/workflows/titus-canonical-consent-ci.yml
permissions:
  contents: read
concurrency:
  group: atlas-staged-titus-canonical-callback-once
  cancel-in-progress: true
jobs:
  callback-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Assert held source and Git deployments disabled
        run: |
          git rev-parse HEAD
          node -e 'if(require("./vercel.json").git.deploymentEnabled!==false) process.exit(1)'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual OAuth consent callback function
        run: node --test tests/titus-canonical-oauth-redirect.test.mjs
      - name: Compile TypeScript without deployment
        run: npx tsc --noEmit
